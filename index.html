 P.forEach((pg,i)=>{const d=document.createElement('div');d.className='th';d.innerHTML='<div class="c2"></div><span class="lb"></span>';const c=d.firstChild;c.style.background=pg.bg;g.appendChild(d);d.querySelector('.lb').textContent=`${i+1}. ${R[i][0]}`;
  pg.els.forEach(el=>{const n=document.createElement('div');n.className='el';c.appendChild(n);paintEl(n,el)});c.style.transform=`scale(${d.clientWidth/1080})`;
  d.onclick=()=>{cur=i;sel=null;m.remove();render();persist()}})};
function parseBulk(t){const out={},L={prem:/^(প্ৰেম|প্রেম|love)$/i,career:/^(কৰ্মজীৱন|কর্মজীবন|career)$/i,edu:/^(শিক্ষা|education)$/i};
 t.split(/^\s*#\s*/m).slice(1).forEach(b=>{const ls=b.split('\n'),h=ls.shift().trim().toLowerCase(),i=R.findIndex((r,j)=>h.includes(r[0])||h.includes(r[1].toLowerCase())||h===String(j+1));if(i<0)return;
  const o={};let k=null;ls.forEach(l=>{const m=l.match(/^\s*([^:：\-–]{2,12}?)\s*[:：]\s*(.*)$/),key=m&&Object.keys(L).find(q=>L[q].test(m[1].trim()));if(key){k=key;o[k]=m[2]}else if(k)o[k]+='\n'+l});
  Object.keys(o).forEach(k=>o[k]=o[k].trim());out[i]=o});return out}
$('bBulk').onclick=()=>{const m=modal(`<h3 style="margin:0 0 6px">Bulk import predictions</h3><p style="color:var(--mu);font-size:12px;margin:0 0 8px">Paste all 12 rashis in one go. Start each with <code># মেষ</code> (or <code># Aries</code>), then <code>প্ৰেম:</code> <code>কৰ্মজীৱন:</code> <code>শিক্ষা:</code> — text can run over several lines. Only the rashis you include are changed.</p><textarea id="bt" placeholder="# মেষ&#10;প্ৰেম: …&#10;কৰ্মজীৱন: …&#10;শিক্ষা: …"></textarea><div class="bar"><button id="bTp">Fill with template / current text</button><button id="bGo" class="pri">Import into pages</button></div>`);
 const g=(i,k)=>(P[i].els.find(e=>e.key===k)||{}).txt||'';
 m.querySelector('#bTp').onclick=()=>{m.querySelector('#bt').value=R.map((r,i)=>`# ${r[0]}\nপ্ৰেম: ${g(i,'prem')}\nকৰ্মজীৱন: ${g(i,'career')}\nশিক্ষা: ${g(i,'edu')}`).join('\n\n')};
 m.querySelector('#bGo').onclick=()=>{const o=parseBulk(m.querySelector('#bt').value),ks=Object.keys(o);let c=0;ks.forEach(i=>Object.keys(o[i]).forEach(k=>{const e=P[i].els.find(x=>x.key===k);if(e){e.txt=o[i][k];c++}}));m.remove();sel=null;render();commit();$('st').textContent=ks.length?`Imported ${c} sections into ${ks.length} rashis.`:'No rashi headings found — start each block with # মেষ, # বৃষ …'}};
$('bPrj').onclick=()=>{const m=modal('<h3 style="margin:0 0 6px">Project</h3><p style="color:var(--mu);font-size:12px;margin:0 0 8px">Your work lives in this browser only. Export a backup file to keep it safe or move it to another device.</p><div class="bar"><button id="pE" class="pri">⬇ Export project (.json)</button><button id="pI">⬆ Import project</button></div><div class="bar"><button id="pR">Rebuild all 12 designs (keeps text)</button><button id="pX" style="color:#c0392b">Erase everything</button></div><input type="file" id="pF" accept=".json" hidden>');
 m.querySelector('#pE').onclick=()=>dl(new Blob([JSON.stringify({P,IMG,V,EX})],{type:'application/json'}),'rashifal-project.json');
 m.querySelector('#pI').onclick=()=>m.querySelector('#pF').click();
 m.querySelector('#pF').onchange=e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!Array.isArray(d.P)||d.P.length!==12)throw 0;P=d.P;IMG=d.IMG||{};Object.assign(V,d.V);Object.assign(EX,d.EX);uid=Math.max(1,...P.flatMap(p=>p.els.map(x=>x.id)))+1;iid=Math.max(0,...Object.keys(IMG).map(k=>+k.slice(1)));sel=null;m.remove();render();commit();$('st').textContent='Project imported.'}catch(x){$('st').textContent='That file is not a valid project.'}};fr.readAsText(f)};
 m.querySelector('#pR').onclick=()=>{if(!confirm('Rebuild all 12 pages with their default rashi designs?'))return;P.forEach((_,j)=>rebuild(j,j));m.remove();sel=null;render();commit()};
 m.querySelector('#pX').onclick=()=>{if(!confirm('Erase ALL pages, images and settings?'))return;try{localStorage.removeItem(SK)}catch(x){}location.reload()}};
render();fitV();commit();document.fonts.ready.then(()=>render());
</script>
